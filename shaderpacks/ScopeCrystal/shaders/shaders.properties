# ScopeCrystal - shaderpack for MC-challenge-HUB
# Vanilla-Look als Standard; Spiegelungen und Glas-Stil per Shader-Menue, Hub- und Arena-Effekte in der Welt pvp.
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
# Hand, Figuren, Partikel: Materialdaten hart ueberschreiben (sonst erben sie Spiegelung vom Hintergrund)
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
# Eigene Textur: animiertes Runen-Sprite-Sheet (4x4) fuer Wand-Partikel
customTexture.runeAtlas=textures/runes.png
customTexture.lavaFloorAtlas=textures/lava-floor.png

# Native palettes switch instantly; portal visibility selects the live geometry.
customTexture.arenaPaletteAtlas=textures/arena-palette.png
uniform.float.arenaLavaMix=if(cameraPosition.x > 60.0, 1.0, 0.0)

# Native destination geometry must be available outside the ordinary camera frustum.
frustum.culling=false
occlusion.culling=false
backFace.solid=false
backFace.cutout=false
backFace.cutoutMipped=false
backFace.translucent=false
# 2x1 Portal-Zustand + vorberechnete Bahnen der Arena-Effekte (lib/arena_paths.glsl)
size.buffer.colortex4=36 28
blend.gbuffers_entities_trans.colortex1=off
blend.gbuffers_entities_trans.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block_trans.colortex1=off
blend.gbuffers_block_trans.colortex2=off
blend.gbuffers_beaconbeam.colortex1=off
blend.gbuffers_beaconbeam.colortex2=off

# Shader-Menue (Optionen > Shaderpacks > ScopeCrystal): alles standardmaessig Vanilla
screen=VANILLA_FOG REFLECTIONS GLASS_STYLE
